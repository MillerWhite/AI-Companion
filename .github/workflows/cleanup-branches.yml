name: Keep main as the only branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            if (repository.data.default_branch !== "main") {
              core.setFailed("Safety stop: the repository default branch is not main.");
              return;
            }
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            for (const branch of branches) {
              if (branch.name === "main") continue;
              core.info(`Deleting ${branch.name}`);
              await github.rest.git.deleteRef({
                owner, repo, ref: `heads/${branch.name}`
              });
            }
            core.info("Branch cleanup finished; main was preserved.");
