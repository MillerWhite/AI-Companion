name: Backend tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Run unit tests
        run: python -m unittest discover -s backend/tests -v
      - name: Build and test native emotion engine
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_emotion.c \
            firmware/esp-idf/tests/companion_emotion_test.c \
            -o /tmp/companion_emotion_test
          /tmp/companion_emotion_test

      - name: Build and test procedural voice engine
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_voice.c \
            firmware/esp-idf/tests/companion_voice_test.c \
            -lm -o /tmp/companion_voice_test
          /tmp/companion_voice_test
