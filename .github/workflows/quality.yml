name: AI Companion quality checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "firmware/**"
      - "third_party/Pip-KeyPet/**"
      - "web/installer/**"
      - "AI_Companion_Emotional_Engine.html"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Compile backend
        run: python -m compileall -q backend

  firmware-core:
    name: Native firmware logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test emotion core
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_emotion.c \
            firmware/tests/test_companion_emotion.c \
            -o /tmp/test_companion_emotion
          /tmp/test_companion_emotion
      - name: Compile and test procedural voice engine
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_voice.c \
            firmware/esp-idf/tests/companion_voice_test.c \
            -lm -o /tmp/companion_voice_test
          /tmp/companion_voice_test
      - name: Compile and test MIT procedural eye renderer
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_face_renderer.c \
            firmware/tests/test_companion_face_renderer.c \
            -lm -o /tmp/companion_face_renderer_test
          /tmp/companion_face_renderer_test

      - name: Compile and test motion classifier
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/esp-idf/main \
            firmware/esp-idf/main/companion_motion.c \
            firmware/esp-idf/tests/companion_motion_test.c \
            -lm -o /tmp/companion_motion_test
          /tmp/companion_motion_test
      - name: Verify upstream renderer provenance and paired spring rig
        run: |
          python - <<'PY'
          from pathlib import Path
          upstream = Path("third_party/Pip-KeyPet/ui/face.c").read_text()
          local = Path("firmware/esp-idf/main/companion_face_renderer.c").read_text()
          assert upstream.replace('#include "face.h"', '#include "companion_face_renderer.h"') == local
          main = Path("firmware/esp-idf/main/main.c").read_text()
          assert "face_shape_spring[2][15]" in main
          assert "for(int n=0;n<(substeps>0?substeps:1);n++)" in main
          assert "e->w = w;" in main and "e->h = h;" in main
          assert "blink_age = now - face_blink_start_us;" in main
          PY

  emotional-engine:
    name: Browser emotional engine syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check emotional engine inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("AI_Companion_Emotional_Engine.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in emotional engine")
          for index, script in enumerate(scripts):
              Path(f"/tmp/emotional-engine-{index}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} inline script(s)")
          PY
          for file in /tmp/emotional-engine-*.js; do node --check "$file"; done
          node --check web/installer/companion-runtime.js
          node --check web/installer/companion-weather.js
          node web/installer/tests/companion-runtime.test.cjs
          node web/installer/tests/companion-weather.test.cjs
          python - <<'PY'
          from pathlib import Path
          html = Path("AI_Companion_Emotional_Engine.html").read_text(encoding="utf-8")
          assert ".mouth" not in html and 'id="mouth"' not in html, "Legacy mouth markup or styles remain"
          assert 'class="eye"' in html and '.eye:before' in html, "Installer-matched procedural eyes missing"
          assert 'id="weatherCanvas"' in html and 'companion-weather.js' in html, "Atmospheric weather renderer missing"
          assert "deviceorientation" in html and "e.alpha" in html and "e.beta" in html and "e.gamma" in html, "Full-axis browser orientation missing"
          assert "orientationZero" in html and "alpha-orientationZero.alpha" in html and "function spring(state,target,stiff,zeta,dt)" in html, "Calibrated orientation and damped spring pose missing"
          assert "setSharedPupilGaze" in html and "(i?1:-1)" not in html, "Both pupils must share one gaze vector"
          assert "rotateX(var(--head-pitch" in html and "rotateY(var(--head-yaw" in html and "rotateZ(var(--head-roll" in html, "Spring-driven three-axis head pose missing"
          assert "@keyframes pet-float" in html and "var(--eye-h,78px)" in html, "Shared living face motion and eye geometry missing"
          assert ".orb.sad{" in html and ".orb.angry{" in html and ".orb.curious{" in html and ".orb.affectionate" in html and ".orb.playful{" in html and ".orb.confused{" in html, "Emotion-specific paired-eye shapes missing"
          assert "width:var(--eye-w,58px)!important;height:var(--eye-h,78px)!important" in html, "Both eyes must use one shared size target"
          assert "animation:none!important" in html and "translate:0 0!important" in html and ".eye.micro-left" not in html, "Independent eye drift must be disabled"
          assert "Math.random()<.55?0:1" not in html and "setSharedPupilGaze" in html, "Both pupils must use the same gaze target"
          assert Path("third_party/Pip-KeyPet/ui/pip.c").exists(), "Upstream animation source missing"
          assert Path("third_party/Pip-KeyPet/LICENSE").exists() and Path("third_party/Pip-KeyPet/ui/face.c").exists(), "MIT attribution and upstream face renderer source missing"
          assert 'weatherScene' in html and "faceKey==='sad'" not in html, "Weather must not be driven by sadness"
          PY

  installer:
    name: Installer JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/installer/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/installer-{index}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} inline script(s)")
          PY
          for file in /tmp/installer-*.js; do node --check "$file"; done
      - name: Validate firmware installer manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("web/installer/manifest.json").read_text(encoding="utf-8"))
          firmware_version = Path("firmware/esp-idf/version.txt").read_text(encoding="utf-8").strip()
          assert manifest["version"] == firmware_version, (manifest["version"], firmware_version)
          assert len(manifest.get("builds", [])) == 1
          build = manifest["builds"][0]
          assert build["chipFamily"] == "ESP32-S3"
          parts = build.get("parts", [])
          assert len(parts) == 1 and parts[0]["offset"] == 0
          assert parts[0]["path"].endswith("/releases/latest/download/AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin")
          print(f"Installer manifest OK for firmware {firmware_version}")
          PY
