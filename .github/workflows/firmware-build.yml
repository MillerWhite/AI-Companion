name: ESP32-S3 firmware build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["firmware-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and merge ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/esp-idf
          command: idf.py build && idf.py merge-bin -o build/AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin -f raw
      - name: Prepare release artifacts
        shell: bash
        run: |
          cp firmware/esp-idf/build/AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin .
          sha256sum AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin > AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ai-companion-esp32s3-firmware
          path: |
            AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin
            AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-companion-esp32s3-firmware
          path: artifacts
      - name: Publish tagged firmware release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin
            artifacts/AI-Companion-ESP32-S3-Touch-AMOLED-1.75C.bin.sha256
